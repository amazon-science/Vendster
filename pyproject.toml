[project]
name = "vendster"
version = "2.0.0"
description = "Vendor Negotiation Environment to Investigate LLM Agent Strategies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Data Processing; numpy >=1.26 for Python 3.10 + modern scipy/statsforecast
    "pandas>=2.3.3",
    "numpy>=1.26,<3",
    # AWS Bedrock Integration
    "boto3>=1.26.0",
    "botocore>=1.29.0",
    "statsforecast>=2.0.3",
    "lightgbm>=4.6.0",
    "chronos-forecasting>=1.5.3",
    "utilsforecast>=0.2.15",
    "scipy>=1.13",
    "scikit-learn>=1.6.1",
    "matplotlib>=3.9.4",
    "neuralforecast>=3.1.2",
    "timesfm[torch]>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vendster"]

[tool.ruff]
line-length = 120
target-version = "py310"          # the f-string/annotation floor we actually support

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
# Correctness rules (all of F, plus bugbear) are enforced. The rules below are switched off
# deliberately: they flag this codebase's house style, not defects.
ignore = [
    "E501",   # long lines — analysis code runs to ~115 cols; the limit above is the real bound
    "E702",   # `a; b` — used for tight guard clauses (`missing.append(x); continue`)
    "N806",   # uppercase locals — L/T/K/S/A mirror the paper's notation
    "N803",   # uppercase arguments — same reason (e.g. `K`, `S`)
    "E741",   # `l` reads as "line" in the transcript/report writers
    "B905",   # bare `zip()` — the sequences are constructed together and equal by build
    "B007",   # unused loop variable where the loop is a fixed-count repeat
]

[tool.ruff.lint.per-file-ignores]
# Raw LaTeX templates are full of literal `{}`; %-formatting avoids doubling every brace.
"vendster/analysis/transcript.py" = ["UP031"]
# The logging levels must be set before neuralforecast/lightning are imported, or they
# re-install their own chatty handlers.
"vendster/forecasters/neural.py" = ["E402"]
# `M` aliases the metrics module to keep the assertion table narrow enough to read.
"tests/test_forecasters.py" = ["N812"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.9",
]
